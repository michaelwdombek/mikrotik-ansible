
---
all:
  children:
    pve_nodes:
      hosts:
        cargo-ai-01: {}
        cargo-ai-02: {}
        cargo-ai-03: {}
    mikrotik_switches:
      vars:

        username: admin
        #ansible_connection: network_cli
        ansible_network_os: community.routeros.routeros
        vlans:
          100:
            name: "PVE"
            subnet: "192.168.100.1/24"
            vrrp: true
          101:
            name: "CEPH"
            subnet: "192.168.101.1/24"
            vrrp: true
        dns_servers:
        - 192.168.8.10
        - 9.9.9.9
        ntp_servers:
        - pool.ntp.org
      hosts:
        cargo-sw-01:
          vrrp_id: 1
          ports:
            ether1:
              connects: "cargo-ai-01"
            ether2:
              connects: "cargo-ai-01"
            ether3:
              connects:  "cargo-ai-02"
            ether4:
              connects: "cargo-ai-02"
            ether5:
              connects: "cargo-ai-03"
            ether6:
              connects: "cargo-ai-03"
            ether7:
              connects: "cargo-ws-01"
              tag: 100
            ether8:
              connects: "cargo-sw-02"
            ether9:
              connects: "UPLINK"

        cargo-sw-02:
          vrrp_id: 2
          ports:
            ether8:
              connects: "cargo-sw-02"
            ether9:
              connects: "UPLINK"

  hosts:
    cargo-sw-01:
      ansible_host: 192.168.8.91
    cargo-sw-02:
      ansible_host: 192.168.8.92
    cargo-ai-01:
      ansible_host: 192.168.8.31
    cargo-ai-02:
      ansible_host: 192.168.8.32
    cargo-ai-03:
      ansible_host: 192.168.8.33
